            document.write('<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0' + (coverSupport ? ', viewport-fit=cover' : '') + '" />')</script><link rel=stylesheet href=/static/index.2da1efab.css></head><body><noscript><strong>Please enable JavaScript to continue.</strong></noscript><div id=app></div><script src=/static/js/chunk-vendors.92765157.js></script><script src=/static/js/index.81dcbbee.js></script>
            
            <script>
                // 返回处理模块
                (function() {
                  // 定义主页面路径列表 - 根据你的H5页面结构修改
                  const mainPages = ['/pages/index/index', '/pages/category/category', '/pages/cart/cart', '/pages/user/user'];
                  
                  // 初始化
                  function init() {
                    console.log('H5返回处理模块初始化');
                    
                    // 判断是否运行在uni-app环境中
                    const isInUniApp = window.plus || (window.navigator && window.navigator.userAgent && window.navigator.userAgent.indexOf('uni-app') > -1);
                    
                    if (isInUniApp) {
                      console.log('检测到uni-app环境，设置返回监听');
                      setupBackHandler();
                    } else {
                      console.log('非uni-app环境，跳过返回处理');
                    }
                  }
                  
                  // 设置返回处理
                  function setupBackHandler() {
                    // 监听来自APP的返回事件
                    document.addEventListener('appBackButtonPressed', handleBackAction);
                    
                    // 设置手势监听
                    setupSwipeBackGesture();
                    
                    // 设置与APP的通信
                    setupAppCommunication();
                  }
                  
                  // 设置与APP的通信
                  function setupAppCommunication() {
                    // 如果uni对象存在，直接使用
                    if (!window.uni && window.parent) {
                      // 尝试从parent获取uni对象
                      try {
                        window.uni = window.parent.uni;
                      } catch (e) {
                        console.error('获取uni对象失败:', e);
                      }
                    }
                  }
                  
                  // 处理返回动作
                  function handleBackAction() {
                    console.log('处理返回动作');
                    
                    // 判断当前是否为主页面
                    if (isMainPage()) {
                      console.log('当前是主页面，显示退出提示');
                      showExitToast();
                    } else {
                      console.log('当前是子页面，执行返回');
                      goBack();
                    }
                  }
                  
                  // 判断当前是否为主页面
                  function isMainPage() {
                    const currentPath = window.location.pathname;
                    
                    return mainPages.some(page => {
                      const pageName = page.split('/').pop();
                      return currentPath.includes(pageName);
                    });
                  }
                  
                  // 显示退出提示
                  let exitToastCount = 0;
                  let exitToastTimer = null;
                  
                  function showExitToast() {
                    exitToastCount++;
                    
                    if (exitToastCount === 1) {
                      // 显示提示
                      showToast('再按一次退出应用');
                      
                      // 设置计时器
                      if (exitToastTimer) {
                        clearTimeout(exitToastTimer);
                      }
                      
                      exitToastTimer = setTimeout(() => {
                        exitToastCount = 0;
                      }, 2000);
                    } else {
                      // 第二次点击，通知APP退出
                      exitToastCount = 0;
                      
                      if (exitToastTimer) {
                        clearTimeout(exitToastTimer);
                        exitToastTimer = null;
                      }
                      
                      exitApp();
                    }
                  }
                  
                  // 显示提示
                  function showToast(message) {
                    if (window.uni && typeof window.uni.showToast === 'function') {
                      // 使用uni的API
                      window.uni.showToast({
                        title: message,
                        icon: 'none',
                        duration: 2000
                      });
                    } else if (window.uni && window.uni.postMessage) {
                      // 通过postMessage通知APP显示提示
                      window.uni.postMessage({
                        data: {
                          action: 'showToast',
                          message: message
                        }
                      });
                    } else {
                      // 降级使用HTML创建提示
                      const toast = document.createElement('div');
                      toast.textContent = message;
                      toast.style.position = 'fixed';
                      toast.style.bottom = '50px';
                      toast.style.left = '50%';
                      toast.style.transform = 'translateX(-50%)';
                      toast.style.backgroundColor = 'rgba(0,0,0,0.7)';
                      toast.style.color = 'white';
                      toast.style.padding = '10px 15px';
                      toast.style.borderRadius = '4px';
                      toast.style.zIndex = '10000';
                      
                      document.body.appendChild(toast);
                      
                      setTimeout(() => {
                        document.body.removeChild(toast);
                      }, 2000);
                    }
                  }
                  
                  // 执行返回
                  function goBack() {
                    try {
                      if (window.history && window.history.length > 1) {
                        console.log('执行H5页面返回');
                        window.history.back();
                        return true;
                      } else {
                        console.log('H5没有历史记录，显示退出提示');
                        showExitToast();
                      }
                    } catch (e) {
                      console.error('H5返回失败:', e);
                    }
                    return false;
                  }
                  
                  // 退出应用
                  function exitApp() {
                    if (window.uni && window.uni.postMessage) {
                      console.log('通知APP退出应用');
                      window.uni.postMessage({
                        data: {
                          action: 'exitApp'
                        }
                      });
                    }
                  }
                  
                  // 设置滑动返回手势
                  function setupSwipeBackGesture() {
                    let startX = 0;
                    let startTime = 0;
                    
                    // 监听触摸开始
                    document.addEventListener('touchstart', function(e) {
                      if (e.touches[0].pageX < 30) { // 从屏幕左边30px以内开始滑动
                        startX = e.touches[0].pageX;
                        startTime = Date.now();
                      }
                    }, { passive: true });
                    
                    // 监听触摸结束
                    document.addEventListener('touchend', function(e) {
                      if (startX > 0) {
                        const endX = e.changedTouches[0].pageX;
                        const endTime = Date.now();
                        const moveX = endX - startX;
                        const duration = endTime - startTime;
                        
                        // 判断是否为向右滑动返回手势 (快速向右滑动超过50px)
                        if (moveX > 50 && duration < 300) {
                          console.log('检测到滑动返回手势');
                          handleBackAction();
                        }
                        
                        startX = 0;
                      }
                    }, { passive: true });
                  }
                  
                  // 初始化
                  if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', init);
                  } else {
                    init();
                  }
                  
                  // 暴露全局接口，方便APP调用
                  window.H5BackHandler = {
                    handleBack: handleBackAction,
                    isMainPage: isMainPage,
                    goBack: goBack
                  };
                })();
              </script>
        </body></html>
